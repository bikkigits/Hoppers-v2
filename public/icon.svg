<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#FFF9C4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)"/>
  <!-- Decorative Mandala Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FFB300" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFB300" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Kash Phul / Festive Petals -->
  <g fill="none" stroke="#FFB300" stroke-width="2.5" stroke-opacity="0.4">
    <path d="M256 66 C256 96 256 120 256 140"/>
    <path d="M256 372 C256 392 256 416 256 446"/>
    <path d="M66 256 C96 256 120 256 140 256"/>
    <path d="M372 256 C392 256 416 256 446 256"/>
  </g>
  <!-- Durga Eye / Trishul / Diya Center Motif -->
  <!-- Base Diya Lamp -->
  <path d="M140 310 C160 380 352 380 372 310 C340 335 172 335 140 310 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <ellipse cx="256" cy="308" rx="116" ry="18" fill="#FF8F00"/>
  <ellipse cx="256" cy="306" rx="90" ry="12" fill="#FFE082"/>
  <!-- Golden Flame -->
  <path d="M256 150 C230 220 220 260 220 290 C220 310 236 324 256 324 C276 324 292 310 292 290 C292 260 282 220 256 150 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  <!-- Inner Flame Light -->
  <path d="M256 195 C244 235 238 260 238 280 C238 292 246 302 256 302 C266 302 274 292 274 280 C274 260 268 235 256 195 Z" fill="#FFF9C4"/>
  <!-- Durga Third Eye Motif above flame -->
  <path d="M220 130 C240 110 272 110 292 130 C272 150 240 150 220 130 Z" fill="none" stroke="#FFB300" stroke-width="3"/>
  <circle cx="256" cy="130" r="5" fill="#E53935"/>
  <!-- Sparkles -->
  <circle cx="160" cy="180" r="3" fill="#FFB300"/>
  <circle cx="352" cy="180" r="3" fill="#FFB300"/>
  <circle cx="180" cy="230" r="2.5" fill="#FFE082"/>
  <circle cx="332" cy="230" r="2.5" fill="#FFE082"/>
</svg>
