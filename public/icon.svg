<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Midnight Gradient Canvas -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141E36" />
      <stop offset="60%" stop-color="#0B1124" />
      <stop offset="100%" stop-color="#060914" />
    </radialGradient>

    <!-- Warm Golden Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#FF9E00" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#E63946" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0B1124" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Edge Gradient -->
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="45%" stop-color="#FDBA74" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Flame Heart Radiant Gradient -->
    <linearGradient id="flameHeart" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B91C1C" />
      <stop offset="35%" stop-color="#EA580C" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>

    <!-- Crimson Base Gradient -->
    <linearGradient id="crimsonBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#5B0D18" />
    </linearGradient>

    <!-- Drop Shadow & Soft Bloom Filters -->
    <filter id="lotusBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Background (Squircle with smooth rounding) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="230" r="180" fill="url(#ambientGlow)" filter="url(#coreGlow)" />

  <!-- Outer Halo Ring -->
  <circle cx="256" cy="210" r="120" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="6 4" />

  <!-- MAIN LOTUS-PIN SHIELD -->
  <g filter="url(#lotusBloom)">
    <!-- Pin Lower V-Tail Body -->
    <path
      d="M256 420 L160 270 C160 210 352 210 352 270 Z"
      fill="url(#crimsonBase)"
      stroke="url(#goldEdge)"
      stroke-width="5"
      stroke-linejoin="round"
    />

    <!-- Lower Pin Anchor Ring -->
    <circle cx="256" cy="425" r="26" fill="url(#crimsonBase)" stroke="url(#goldEdge)" stroke-width="5" />
    <circle cx="256" cy="425" r="10" fill="#F59E0B" />

    <!-- Pin Spine Center Line -->
    <line x1="256" y1="300" x2="256" y2="400" stroke="url(#goldEdge)" stroke-width="4" stroke-linecap="round" />

    <!-- OUTSIDE LOTUS PETALS (Deep Crimson Layer) -->
    <!-- Top Apex Outer -->
    <path
      d="M256 85 C225 125 210 165 256 195 C302 165 287 125 256 85 Z"
      fill="#991B1B"
      stroke="url(#goldEdge)"
      stroke-width="4"
    />

    <!-- Upper Left Outer Petal -->
    <path
      d="M175 145 C170 195 195 225 235 210 C210 175 195 155 175 145 Z"
      fill="#991B1B"
      stroke="url(#goldEdge)"
      stroke-width="4"
    />

    <!-- Upper Right Outer Petal -->
    <path
      d="M337 145 C342 195 317 225 277 210 C302 175 317 155 337 145 Z"
      fill="#991B1B"
      stroke="url(#goldEdge)"
      stroke-width="4"
    />

    <!-- Mid Left Flank Petal -->
    <path
      d="M125 220 C140 265 180 270 205 240 C175 220 150 215 125 220 Z"
      fill="#B91C1C"
      stroke="url(#goldEdge)"
      stroke-width="4"
    />

    <!-- Mid Right Flank Petal -->
    <path
      d="M387 220 C372 265 332 270 307 240 C337 220 362 215 387 220 Z"
      fill="#B91C1C"
      stroke="url(#goldEdge)"
      stroke-width="4"
    />

    <!-- INNER GOLDEN RADIANT PETALS -->
    <!-- Main Center-Top Radiant Petal -->
    <path
      d="M256 105 C215 160 215 220 256 260 C297 220 297 160 256 105 Z"
      fill="url(#flameHeart)"
      stroke="url(#goldEdge)"
      stroke-width="4.5"
    />

    <!-- Mid-Left Golden Petal -->
    <path
      d="M165 200 C170 250 215 265 245 245 C220 205 190 190 165 200 Z"
      fill="url(#flameHeart)"
      stroke="url(#goldEdge)"
      stroke-width="4"
    />

    <!-- Mid-Right Golden Petal -->
    <path
      d="M347 200 C342 250 297 265 267 245 C292 205 322 190 347 200 Z"
      fill="url(#flameHeart)"
      stroke="url(#goldEdge)"
      stroke-width="4"
    />

    <!-- Bottom Center Lotus Base Petal -->
    <path
      d="M256 315 C215 285 225 250 256 250 C287 250 297 285 256 315 Z"
      fill="url(#flameHeart)"
      stroke="url(#goldEdge)"
      stroke-width="3.5"
    />

    <!-- CENTRAL SACRED DIYA FLAME / HEART -->
    <path
      d="M256 160 C235 205 230 235 256 260 C282 235 277 205 256 160 Z"
      fill="#FFFBEB"
      filter="url(#coreGlow)"
    />

    <ellipse cx="256" cy="225" rx="14" ry="24" fill="#FEF08A" />
    <circle cx="256" cy="230" r="7" fill="#FFFFFF" />
  </g>

  <!-- Ambient Micro Sparkles -->
  <circle cx="430" cy="430" r="3" fill="#F59E0B" opacity="0.6" />
  <circle cx="445" cy="415" r="1.5" fill="#FFEAA7" opacity="0.8" />
  <circle cx="85" cy="110" r="2" fill="#F59E0B" opacity="0.4" />
</svg>
