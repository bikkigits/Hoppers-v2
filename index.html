    <script>
      (function() {
        ['error', 'warn', 'info', 'log'].forEach(function(method) {
          var orig = console[method];
          console[method] = function() {
            for (var i = 0; i < arguments.length; i++) {
              var arg = arguments[i];
              if (
                typeof arg === 'string' &&
                (arg.indexOf('[vite]') !== -1 ||
                 arg.toLowerCase().indexOf('websocket') !== -1)
              ) {
                return;
              }
            }
            return orig.apply(console, arguments);
          };
        });

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.toLowerCase().indexOf('websocket') !== -1)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && (e.reason && (e.reason.message || e.reason))) || '';
          if (typeof reason === 'string' && (reason.indexOf('[vite]') !== -1 || reason.toLowerCase().indexOf('websocket') !== -1)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
